[project]
name = "nextshift"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "strands-agents>=0.2",
    "bedrock-agentcore>=0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
